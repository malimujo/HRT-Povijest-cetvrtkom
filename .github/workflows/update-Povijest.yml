name: Ažuriraj Povijest četvrtkom M3U
on:
  schedule:
    - cron: '0,30 16-22 * * 4'  # ČETVRTCI 17:00-23:30 CET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # ❌ UKLONJENO: cache: 'npm' - nema package-lock.json!
    
    # PUPPETEER SPECIFIČNI SETUP
    - name: Instaliraj Chrome i Puppeteer
      run: |
        npm init -y
        npm install puppeteer
        npx puppeteer browsers install chrome
    
    - name: Debug - Provjeri vrijeme
      run: |
        echo "UTC: $(date -u)"
        echo "CET: $(date)"
        echo "Dan (4=četvrtak): $(date +%w)"
    
    - name: Generiraj Povijest M3U
      run: node povijest.js
    
    - name: Provjeri M3U
      run: |
        ls -la *.m3u
        test -f povijest-cetvrtkom.m3u && echo "✅ OK!" || exit 1
        cat povijest-cetvrtkom.m3u
    
    - name: Commit i push
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Povijest: ${{ github.run_id }}"
        file_pattern: povijest-cetvrtkom.m3u
